<head>

<title>新人旅程 Onboarding Journey</title>
<!-- V11 上鎖外殼（沿用 V9／V10／V10.1，新增簡體中文）：遊戲本體已加密，輸入旅程密碼後才在這台裝置上解密。檔案內不含密碼本身。 -->
<style>
html,body{margin:0;height:100%}
#lock{position:fixed;inset:0;z-index:2147483000;overflow:hidden;font-family:"PingFang TC","Microsoft JhengHei","Noto Sans TC","Segoe UI",sans-serif;color:#3E4270;
  background:linear-gradient(180deg,#FCE4D8 0%,#F6DDEA 46%,#D6E2F5 100%);transition:opacity .8s ease;-webkit-tap-highlight-color:transparent}
#lock.out{opacity:0;pointer-events:none}
#lk{position:absolute;inset:0;width:100%;height:100%}
#lkLang{position:absolute;top:max(14px,env(safe-area-inset-top));right:16px;display:flex;gap:2px;border-radius:999px;background:rgba(255,255,255,.85);padding:3px;box-shadow:0 6px 18px -10px rgba(40,42,74,.5)}
#lkLang button{border:0;border-radius:999px;background:transparent;color:#6B6890;font-weight:800;font-size:13px;font-family:inherit;padding:6px 11px;cursor:pointer;white-space:nowrap}
#lkLang button.on{background:#3E4270;color:#fff}
html[lang="zh-Hans"] #lock{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","PingFang TC","Microsoft JhengHei","Segoe UI",sans-serif}
.lk-p{position:absolute;left:50%;bottom:max(6vh,24px);transform:translateX(-50%);width:min(380px,calc(100% - 32px));text-align:center;transition:opacity .35s,transform .35s}
.lk-p.hide{opacity:0;transform:translate(-50%,10px);pointer-events:none}
.lk-logo{width:78px;height:20px;margin:0 auto 10px;background:#EE3942;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat}
.lk-p h1{margin:0;font-size:28px;font-weight:700;letter-spacing:.24em;text-indent:.24em}
.lk-en{font-size:11.5px;font-weight:700;letter-spacing:.32em;text-indent:.32em;color:#8E87A8;margin:4px 0 12px}
.lk-bu{display:inline-block;margin:-4px 0 12px;padding:3px 12px;border-radius:999px;background:rgba(255,255,255,.7);font-size:13px;font-weight:700;color:#5B5880}.lk-bu:empty{display:none}
#lkSub{margin:0 0 14px;font-size:15px;font-weight:600;color:#6B6890}
#lkForm{display:flex;gap:8px;background:rgba(255,255,255,.92);border-radius:16px;padding:6px;box-shadow:0 16px 36px -20px rgba(40,42,74,.6)}
#lkPw{flex:1;min-width:0;border:0;outline:0;background:transparent;font-weight:600;font-size:17px;font-family:inherit;color:#3E4270;padding:10px 12px;letter-spacing:.04em}
#lkPw::placeholder{color:#B4AEC9;letter-spacing:0}
#lkGo{border:0;border-radius:12px;background:#3E4270;color:#fff;font-weight:800;font-size:15px;font-family:inherit;padding:0 20px;cursor:pointer;min-height:44px}
#lkGo:disabled{opacity:.55;cursor:default}
#lkForm.shake{animation:lkShake .42s}
@keyframes lkShake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(2px)}}
.lk-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:12.5px;font-weight:600;color:#8E87A8}
.lk-row{flex-wrap:wrap;gap:4px 14px;line-height:1.45}
.lk-row label{display:flex;align-items:center;gap:6px;cursor:pointer;white-space:nowrap;flex:none}
.lk-row>span{margin-left:auto;text-align:right}
#lkMsg{min-height:22px;margin-top:10px;font-size:14px;font-weight:700;line-height:1.5;color:#C0505A}
#lkMsg.ok{color:#2F8F86}
.lk-ver{margin-top:2px;font-size:11px;font-weight:600;color:#A9A3C0;letter-spacing:.04em}.lk-ver:empty{display:none}
#lkHello{position:absolute;left:0;right:0;bottom:max(12vh,60px);text-align:center;opacity:0;transition:opacity .5s;pointer-events:none}
#lkHello.on{opacity:1}
#lkHello b{display:block;font-size:24px;letter-spacing:.12em;text-indent:.12em}
#lkHello span{display:block;margin-top:8px;font-size:13.5px;font-weight:600;color:#6B6890}
@media (max-height:520px) and (min-aspect-ratio:4/3){.lk-p{left:auto;right:4%;bottom:auto;top:50%;transform:translateY(-50%);width:min(360px,46%)}.lk-p.hide{transform:translate(10px,-50%)}#lkHello{left:0;right:auto;width:54%;bottom:12%}}
@media (max-height:640px){.lk-p h1{font-size:24px}.lk-en{margin-bottom:8px}#lkSub{margin-bottom:10px}}
</style>
</head>

// V10.1：HR 更新內容、重新產生檔案後，用記住的鑰匙打開新版本，不用再輸入密碼；
